name: YouTube extension

on:
  push:
    paths:
      - 'extensions/**'
      - '.github/workflows/youtube-extension.yml'
  pull_request:
    paths:
      - 'extensions/**'
      - '.github/workflows/youtube-extension.yml'
  workflow_dispatch:

concurrency:
  group: youtube-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aniyomi-all.youtube-debug
          path: extensions/src/all/youtube/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Lint
        run: ./gradlew lintDebug
