[versions]
agp = "8.7.3"
kotlin = "1.9.24"
serialization = "1.5.1"
coroutines = "1.7.1"

[libraries]
# Aniyomi extensions API (stubs; the real implementation is provided by the app at runtime)
aniyomi-lib = { module = "com.github.aniyomiorg:extensions-lib", version = "14" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
rxjava = { module = "io.reactivex:rxjava", version = "1.3.8" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.0.0-alpha.11" }
jsoup = { module = "org.jsoup:jsoup", version = "1.16.1" }

[bundles]
# Everything here is supplied by the host app (Aniyomi / Kuukiyomi), so it is compileOnly.
common = ["aniyomi-lib", "kotlin-stdlib", "kotlin-json", "coroutines-core", "rxjava", "okhttp", "jsoup"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
